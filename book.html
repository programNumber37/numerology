<!DOCTYPE html>
<html lang="en" data-theme="warm">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book - Numerology</title>
    <meta name="description" content="Your saved numerology readings.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="genetic-data-svgrepo-com.svg">
    <link rel="stylesheet" href="css/style.css?v=7">
    <link rel="stylesheet" href="css/themes.css?v=6">

    <!-- Scripts (Deferred) -->
    <script src="js/shared/theme-toggle.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/shared/supabase-config.js" defer></script>
    <script src="js/shared/account.js" defer></script>

    <style>
        .bk-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .bk-topbar {
            margin-bottom: 28px;
        }

        .bk-area {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 12px 28px 40px;
            box-sizing: border-box;
        }

        .bk-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 600;
            color: var(--th-text);
            margin: 0 0 6px;
            text-align: center;
            text-wrap: balance;
        }

        .bk-sub {
            font-size: 0.84rem;
            color: var(--th-text-muted);
            margin: 0 0 28px;
            text-align: center;
            text-wrap: pretty;
        }

        .bk-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bk-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 20px;
            background: var(--th-surface);
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07), 0 1px 4px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            animation: bk-in 0.3s cubic-bezier(0.2, 0, 0, 1);
        }

        @keyframes bk-in {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bk-who {
            min-width: 0;
        }

        .bk-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--th-text);
            margin: 0;
            overflow-wrap: anywhere;
        }

        .bk-date {
            font-size: 0.8rem;
            color: var(--th-text-muted);
            margin: 2px 0 0;
        }

        .bk-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .bk-btn {
            display: inline-flex;
            align-items: center;
            padding: 7px 14px;
            border: none;
            border-radius: 20px;
            background: var(--th-surface-alt);
            color: var(--th-text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            transition: background 0.2s, color 0.2s, transform 0.15s cubic-bezier(0.2, 0, 0, 1);
        }

        .bk-btn:hover {
            color: var(--th-text);
            background: var(--th-border-light);
        }

        .bk-btn:active {
            transform: scale(0.96);
        }

        .bk-btn--open {
            background: var(--th-accent);
            color: #fff;
        }

        .bk-btn--open:hover {
            background: var(--th-accent-hover);
            color: #fff;
        }

        .bk-btn--danger:hover {
            color: #c0392b;
        }

        .bk-state {
            text-align: center;
            padding: 32px 24px;
            background: var(--th-surface);
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .bk-state h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--th-text);
            margin: 0 0 8px;
        }

        .bk-state p {
            font-size: 0.85rem;
            color: var(--th-text-muted);
            margin: 0 0 18px;
            text-wrap: pretty;
        }

        .bk-state .bk-btn {
            padding: 10px 22px;
            font-size: 0.84rem;
        }

        @media (max-width: 600px) {
            .bk-topbar {
                margin-bottom: 24px;
            }

            .bk-area {
                padding: 8px 16px 32px;
            }

            .bk-card {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .bk-actions .bk-btn {
                flex: 1;
                justify-content: center;
            }

            .bk-actions {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="main-container reading-page bk-page">

        <header class="site-topbar bk-topbar">
            <div class="site-topbar-left">
            <a href="reading.html" class="header-title-group pill-container report-btn"
                style="text-decoration: none; color: var(--th-text-secondary); padding: 4px 16px; font-weight: bold; font-size: 0.85rem; white-space: nowrap; height: 32px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 7px;">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                Reading
            </a>
            </div>
            <div class="site-topbar-right">
            <button class="shared-round-theme-btn theme-cycle-btn" title="Toggle Theme" aria-label="Toggle Theme">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"></path>
                </svg>
            </button>
            <div class="theme-toggle-bar" id="themeToggleBar">
                <button class="theme-toggle-btn" data-theme="classic" aria-label="Classic theme">Classic</button>
                <button class="theme-toggle-btn active" data-theme="warm" aria-label="Warm theme">Warm</button>
            </div>
            </div>
        </header>

        <main class="bk-area">
            <h1 class="bk-title">My Book</h1>
            <p class="bk-sub">The people you care about, and their readings.</p>
            <div id="bookContent"></div>
        </main>

    </div>

    <script>
        (function () {
            const content = document.getElementById('bookContent');
            const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

            function el(tag, attrs, ...children) {
                const node = document.createElement(tag);
                for (const [k, v] of Object.entries(attrs || {})) {
                    if (k === 'class') node.className = v;
                    else if (k === 'text') node.textContent = v;
                    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
                    else node.setAttribute(k, v);
                }
                children.flat().forEach(c => c && node.append(c));
                return node;
            }

            // "1990-03-12" -> "12 March 1990" without going through Date (no timezone shifts)
            function formatDate(iso) {
                const [y, m, d] = iso.split('-').map(Number);
                return `${d} ${MONTHS[m - 1]} ${y}`;
            }

            function showState(title, text, action) {
                content.replaceChildren(el('div', { class: 'bk-state' },
                    el('h2', { text: title }),
                    el('p', { text }),
                    action));
            }

            function renderCard(profile) {
                const card = el('div', { class: 'bk-card' },
                    el('div', { class: 'bk-who' },
                        el('h2', { class: 'bk-name', text: profile.name }),
                        el('p', { class: 'bk-date', text: formatDate(profile.birthdate) })),
                    el('div', { class: 'bk-actions' },
                        el('a', { class: 'bk-btn bk-btn--open', text: 'Open',
                            href: `reading.html?dob=${encodeURIComponent(profile.birthdate)}&name=${encodeURIComponent(profile.name)}` }),
                        el('button', { class: 'bk-btn', type: 'button', text: 'Rename', onclick: async () => {
                            const name = await Account.askName({ title: 'Rename', label: 'Name', value: profile.name, confirm: 'Save' });
                            if (!name || name === profile.name) return;
                            try { await Account.renameProfile(profile.id, name); load(); }
                            catch (err) { alert('Could not rename: ' + (err.message || err)); }
                        } }),
                        el('button', { class: 'bk-btn bk-btn--danger', type: 'button', text: 'Delete', onclick: async () => {
                            if (!confirm(`Delete ${profile.name} from your Book?`)) return;
                            try { await Account.deleteProfile(profile.id); load(); }
                            catch (err) { alert('Could not delete: ' + (err.message || err)); }
                        } })));
                return card;
            }

            async function load() {
                await Account.ready;
                if (!Account.configured) {
                    showState('Accounts are not set up yet', 'supabase-config.js has no project URL and key.');
                    return;
                }
                if (!Account.username) {
                    showState('Log in to see your Book', 'Sign up with just a username and password to save readings.',
                        el('button', { class: 'bk-btn bk-btn--open', type: 'button', text: 'Log in or sign up', onclick: () => Account.openAuth('login') }));
                    return;
                }
                try {
                    const profiles = await Account.listProfiles();
                    if (!profiles.length) {
                        showState('Your Book is empty', 'Reveal a birth reading and choose Add to Book to save it here.',
                            el('a', { class: 'bk-btn bk-btn--open', href: 'reading.html', text: 'Go to Reading' }));
                        return;
                    }
                    content.replaceChildren(el('div', { class: 'bk-list' }, profiles.map(renderCard)));
                } catch (err) {
                    showState('Could not load your Book', String(err.message || err),
                        el('button', { class: 'bk-btn', type: 'button', text: 'Try again', onclick: load }));
                }
            }

            window.addEventListener('DOMContentLoaded', () => {
                Account.onChange(load); // login, logout, session restore
                load();
            });
        })();
    </script>
</body>

</html>
