<!DOCTYPE html>
<html lang="en" data-theme="warm">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Europe Map — Library of Ohara</title>
    <meta name="description"
        content="An interactive custom vector map of Europe featuring clickable country borders, major cities, and symbolic energy information.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="genetic-data-svgrepo-com.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="map.css?v=2">

    <!-- Preconnections & Preloads for Map Performance -->
    <link rel="preload" href="mapPaths.js" as="script" crossorigin="anonymous">

    <!-- Scripts (Deferred for non-blocking parallel load) -->
    <script src="https://d3js.org/d3.v7.min.js" defer></script>
    <script src="theme-toggle.js" defer></script>
    <script src="mapDatabase.js?v=3" defer></script>
    <script src="worldCountries.js" defer></script>
    <script src="mapPaths.js" defer></script>
    <script src="cnyDates.js" defer></script>
    <script src="numerology.js" defer></script>
    <script src="worldCapitals.js" defer></script>
    <script src="extendedCities.js" defer></script>
    <script src="map.js?v=4" defer></script>
</head>

<body>
    <div class="map-page">

        <!-- Top Navigation Bar -->
        <header class="map-topbar">
            <div class="map-page-header-actions">
                <a href="library.html" class="map-back-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    Library
                </a>
            </div>
            <h1 class="map-page-title">WORLD</h1>
            <div class="theme-toggle-bar" id="themeToggleBar">
                <button class="theme-toggle-btn" data-theme="original" aria-label="Original theme">Original</button>
                <button class="theme-toggle-btn active" data-theme="warm" aria-label="Warm theme">Warm</button>
            </div>
        </header>

        <!-- Main Map Container -->
        <main class="map-container">

            <!-- Movable Map Window Frame -->
            <div class="map-window">
                <!-- Simplified Window Header -->
                <header class="map-window-header">
                    <div class="map-window-title" id="mapWindowTitle">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" style="flex-shrink: 0;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                            <path d="M2 12h20"></path>
                        </svg>
                        <span id="mapWindowTitleText" class="title-text">WORLD</span>
                    </div>
                </header>

                <!-- Viewport & Movable SVG Canvas -->
                <div class="map-viewport" id="mapViewport">

                    <!-- Floating Zoom Control Stack -->
                    <div class="map-floating-ctrls">
                        <button class="map-ctrl-btn" onclick="window.europeMap?.zoomDelta(1.5)"
                            title="Zoom In">+</button>
                        <button class="map-ctrl-btn" onclick="window.europeMap?.zoomDelta(0.666)"
                            title="Zoom Out">−</button>
                        <button class="map-ctrl-btn" onclick="window.europeMap?.resetView()"
                            title="Reset View">↺</button>
                    </div>

                    <!-- SVG Canvas -->
                    <svg id="mapSvgCanvas" class="map-svg-canvas" viewBox="0 0 1000 700"
                        xmlns="http://www.w3.org/2000/svg">
                        <!-- Background click layer -->
                        <rect width="1000" height="700" class="map-svg-bg" fill="transparent" />

                        <g id="mapZoomContainer">
                            <!-- Decorative Sea Grids / Meridian Lines -->
                            <g opacity="0.15" stroke="var(--th-border)" stroke-width="0.8" stroke-dasharray="4 4">
                                <line x1="100" y1="0" x2="100" y2="700" />
                                <line x1="300" y1="0" x2="300" y2="700" />
                                <line x1="500" y1="0" x2="500" y2="700" />
                                <line x1="700" y1="0" x2="700" y2="700" />
                                <line x1="900" y1="0" x2="900" y2="700" />
                                <line x1="0" y1="150" x2="1000" y2="150" />
                                <line x1="0" y1="350" x2="1000" y2="350" />
                                <line x1="0" y1="550" x2="1000" y2="550" />
                            </g>

                            <!-- EUROPE COUNTRY BORDERS (D3 will populate this) -->
                            <g id="countryGroup"></g>

                            <g id="countryOverlayGroup" style="pointer-events: none;">
                                <use id="activeCountryUse" href="" />
                            </g>

                            <!-- CITIES (D3 will populate this) -->
                            <g id="cityGroup"></g>
                        </g>

                        <!-- OVERLAY LAYER (Always on top, immune to background hit interference) -->
                        <g id="overlayZoomContainer">
                            <g id="cityOverlayGroup"></g>
                        </g>

                    </svg>

                </div>
            </div>

            <!-- Location Information Display Panel (Below Map Window) -->
            <section class="map-info-panel" id="mapInfoPanel">
                <div class="map-info-empty"></div>
            </section>

        </main>
    </div>

</body>

</html>
